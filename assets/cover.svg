<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Prism product cover</title>
  <desc id="desc">A dark violet prompt design interface with a scoring panel and colorful prism motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090711"/><stop offset="1" stop-color="#121021"/></linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5b0ff"/><stop offset=".48" stop-color="#7de8ff"/><stop offset="1" stop-color="#ff83c6"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cab8ff"/><stop offset="1" stop-color="#8d68ed"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="34" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="210" fill="#815bd8" opacity=".16" filter="url(#blur)"/>
  <circle cx="230" cy="800" r="180" fill="#36bdda" opacity=".1" filter="url(#blur)"/>
  <g transform="translate(90 72)">
    <g transform="translate(0 2)"><rect x="0" y="0" width="35" height="35" rx="10" fill="none" stroke="#ad8bff" stroke-width="2" transform="rotate(-8 18 18)"/><rect x="7" y="7" width="21" height="21" rx="7" fill="none" stroke="#69deff" stroke-width="2" transform="rotate(38 18 18)"/><rect x="12" y="12" width="11" height="11" rx="4" fill="#ff83c6" opacity=".7" transform="rotate(70 18 18)"/></g>
    <text x="50" y="29" fill="#f4f1ff" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">Prompt <tspan fill="#aaa3b9">Prism</tspan></text>
  </g>
  <text x="90" y="190" fill="#a784ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">PROMPT DESIGN, REFRACTED</text>
  <text x="90" y="252" fill="#f4f1ff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="760" letter-spacing="-2">Turn fuzzy prompts into</text>
  <text x="90" y="315" fill="url(#prism)" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="760" letter-spacing="-2">clear, testable systems.</text>
  <text x="92" y="358" fill="#9b96ad" font-family="Inter,Arial,sans-serif" font-size="20">A local-first workbench for templates, variants, and deterministic analysis.</text>
  <g transform="translate(90 410)" filter="url(#shadow)">
    <rect width="1420" height="410" rx="24" fill="#151220" stroke="#2a2539"/>
    <rect width="1420" height="58" rx="24" fill="#1a1627"/><path d="M0 58h1420" stroke="#2a2539"/>
    <circle cx="27" cy="29" r="5" fill="#ff83c6"/><circle cx="45" cy="29" r="5" fill="#ffd466"/><circle cx="63" cy="29" r="5" fill="#b8ff6a"/>
    <text x="96" y="36" fill="#c8c1d7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Support reply architect</text>
    <g transform="translate(28 82)">
      <rect width="875" height="300" rx="16" fill="#0d0b15" stroke="#2b2638"/>
      <text x="25" y="34" fill="#a784ff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">PROMPT CANVAS</text>
      <text x="25" y="67" fill="#f4f1ff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Shape the instruction</text>
      <rect x="25" y="88" width="825" height="1" fill="#2a2535"/>
      <circle cx="38" cy="112" r="5" fill="#a784ff"/><text x="51" y="117" fill="#e4deef" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Variant A</text>
      <g font-family="ui-monospace,monospace" font-size="13" fill="#bbb4c9">
        <text x="26" y="151">You are a customer support specialist for a collaborative work platform.</text>
        <text x="26" y="181">Write a reply to <tspan fill="#7de8ff">{{audience}}</tspan> about this issue:</text>
        <text x="26" y="211" fill="#c5b0ff">{{issue}}</text>
        <text x="26" y="251">Your response must be specific, concise, and grounded in confirmed facts.</text>
      </g>
      <rect x="25" y="273" width="180" height="9" rx="5" fill="#292437"/><rect x="218" y="273" width="110" height="9" rx="5" fill="#211d2d"/>
    </g>
    <g transform="translate(927 82)">
      <rect width="465" height="300" rx="16" fill="#11101a" stroke="#2b2638"/>
      <circle cx="91" cy="108" r="55" fill="none" stroke="#272231" stroke-width="10"/><path d="M91 53a55 55 0 1 1-49 80" fill="none" stroke="url(#prism)" stroke-width="10" stroke-linecap="round"/>
      <text x="91" y="115" text-anchor="middle" fill="#f4f1ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">92</text>
      <text x="170" y="86" fill="#a784ff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">PRISM SCORE</text>
      <text x="170" y="118" fill="#f4f1ff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Crisp and testable</text>
      <text x="170" y="145" fill="#8e889d" font-family="Inter,Arial,sans-serif" font-size="12">Strong structure across every lens.</text>
      <g transform="translate(28 186)" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9b96ad">
        <text y="8">Intent</text><rect x="74" width="310" height="7" rx="4" fill="#25212f"/><rect x="74" width="292" height="7" rx="4" fill="#b8ff6a"/>
        <text y="39">Context</text><rect x="74" y="31" width="310" height="7" rx="4" fill="#25212f"/><rect x="74" y="31" width="270" height="7" rx="4" fill="#7de8ff"/>
        <text y="70">Output</text><rect x="74" y="62" width="310" height="7" rx="4" fill="#25212f"/><rect x="74" y="62" width="283" height="7" rx="4" fill="#bca0ff"/>
      </g>
    </g>
  </g>
</svg>
